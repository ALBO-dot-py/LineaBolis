<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <!-- TODO(sicurezza): 'unsafe-inline' in script-src -->

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login</title>
  <link rel="icon" href="/web/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>
<body>
  <section class="hero is-fullheight is-light">
    <div class="hero-body">
      <div class="container" style="max-width:420px">
        <div class="box">
          <h1 class="title has-text-centered">Accesso</h1>
          <div id="message" hidden></div>
          <form id="login">
            <div class="field">
              <label class="label">Email</label>
              <div class="control">
                <input id="email" class="input" type="email" required autofocus>
              </div>
            </div>
            <div class="field">
              <label class="label">Password</label>
              <div class="control">
                <input id="password" class="input" type="password" required>
              </div>
            </div>
            <button class="button is-primary is-fullwidth">Entra</button>
          </form>
          <p class="help has-text-centered mt-4">
            Password dimenticata? Contatta il tuo nutrizionista o l'amministratore per reimpostarla
          </p>
        </div>
      </div>
    </div>
  </section>

  <script src="/web/app.js?v=20260721-2"></script>
  <script>
    // Se l'utente sembra già loggato, viene verificato col server prima di saltare alla sua area
    (async () => {
      if (!token()) return;
      let current;
      try {
        current = await request("/auth/me");
      } catch (_) {
        return;
      }
      location.replace(profileUrl(current.ruolo));
    })();

    $("login").onsubmit = async (e) => {
      e.preventDefault();
      try {
        const data = await request("/auth/login", {
          method: "POST",
          body: JSON.stringify({ email: $("email").value, password: $("password").value }),
        });
        sessionStorage.setItem("token", data.token);
        sessionStorage.setItem("user", JSON.stringify(data.utente));

        location.href = profileUrl(data.utente.ruolo);
      } catch (error) {
        message(error.message);
      }
    };
  </script>
</body>
</html>
