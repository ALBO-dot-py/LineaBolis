<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <!-- TODO(sicurezza): 'unsafe-inline' in script-src -->
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Imposta password</title>
  <link rel="icon" href="/web/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>
<body>
  <section class="hero is-fullheight is-light">
    <div class="hero-body">
      <div class="container" style="max-width:420px">
        <div class="box">
          <h1 class="title">Imposta password</h1>
          <div id="message" hidden></div>
          <form id="form">
            <div class="field">
              <label class="label">Nuova password</label>
              <input id="newPassword" class="input" type="password" autocomplete="new-password" minlength="10" required>
              <p class="help">La password deve avere 10 caratteri, una maiuscola, una minuscola, un numero e un carattere speciale</p>
            </div>
            <div class="field">
              <label class="label">Conferma password</label>
              <input id="confirmPassword" class="input" type="password" autocomplete="new-password" minlength="10" required>
            </div>
            <button class="button is-primary is-fullwidth">Salva</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <script src="/web/app.js?v=20260721-2"></script>
  <script>
    sessionStorage.clear();
    const setupToken = new URLSearchParams(location.hash.slice(1)).get("token");
    if (!setupToken) {
      message("Link non valido");
      $("form").hidden = true;
    }

    $("form").onsubmit = async (event) => {
      event.preventDefault();
      if ($("newPassword").value !== $("confirmPassword").value) {
        return message("Le password non coincidono");
      }
      try {
        await request("/auth/imposta-password", {
          method: "POST",
          body: JSON.stringify({
            token: setupToken,
            nuova_password: $("newPassword").value,
            conferma_nuova_password: $("confirmPassword").value,
          }),
        });
        location.replace("/web/login.html");
      } catch (error) {
        message(error.message);
      }
    };
  </script>
</body>
</html>
